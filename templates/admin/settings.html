{% extends "base.html" %}

{% block title %}Platform Settings - Enterprise LMS{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Platform Configuration</h1>
    <p class="page-subtitle">Configure system defaults, academic policies, and security settings</p>
  </div>
</div>

<div style="max-width: 700px;">
  <div class="card">
    <form method="POST" action="{{ url_for('admin.settings') }}">
      <div class="form-group">
        <label class="form-label">Platform Name</label>
        <input type="text" name="site_name" class="form-control" value="{{ settings.get('site_name', 'Enterprise LMS') }}">
      </div>

      <div class="form-group">
        <label class="form-label">Institutional Support Email</label>
        <input type="email" name="support_email" class="form-control" value="{{ settings.get('support_email', 'support@lms.local') }}">
      </div>

      <div class="form-group">
        <label class="form-label">Minimum Required Attendance Percentage</label>
        <input type="number" step="0.5" name="min_attendance_percentage" class="form-control" value="{{ settings.get('min_attendance_percentage', '75.0') }}">
      </div>

      <div class="form-group">
        <label class="form-label">Default Passing Score (%)</label>
        <input type="number" step="0.5" name="default_passing_grade" class="form-control" value="{{ settings.get('default_passing_grade', '60.0') }}">
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="margin-top: 1rem;">
        Save Configuration
      </button>
    </form>
  </div>
</div>
{% endblock %}
