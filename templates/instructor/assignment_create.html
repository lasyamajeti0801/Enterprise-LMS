{% extends "base.html" %}

{% block title %}Create Assignment - Instructor Portal{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Create Assignment: {{ course.code }}</h1>
    <p class="page-subtitle">{{ course.title }}</p>
  </div>
  <a href="{{ url_for('instructor.assignments', course_id=course.id) }}" class="btn btn-secondary btn-sm">&larr; Back to Assignments</a>
</div>

<div style="max-width: 700px;">
  <div class="card">
    <form method="POST" action="{{ url_for('instructor.create_assignment', course_id=course.id) }}">
      <div class="form-group">
        <label class="form-label">Assignment Title</label>
        <input type="text" name="title" class="form-control" placeholder="e.g. Project 1: Database Schema & Migration Service" required>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Submission Due Date & Time</label>
          <input type="datetime-local" name="due_date" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Maximum Total Marks</label>
          <input type="number" step="1" name="max_marks" class="form-control" value="100" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Detailed Instructions & Grading Rubric</label>
        <textarea name="instructions" class="form-control" rows="6" placeholder="Provide requirements, specifications, test cases, and delivery expectations..." required></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="margin-top: 1rem;">
        Publish Assignment to Course
      </button>
    </form>
  </div>
</div>
{% endblock %}
