{% extends "base.html" %}

{% block title %}Create Course - Instructor Portal{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Course Creation Wizard</h1>
    <p class="page-subtitle">Define foundational course specifications and learning objectives</p>
  </div>
  <a href="{{ url_for('instructor.courses') }}" class="btn btn-secondary btn-sm">&larr; Back to Courses</a>
</div>

<div style="max-width: 800px;">
  <div class="card">
    <form method="POST" action="{{ url_for('instructor.create_course') }}">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Course Code</label>
          <input type="text" name="code" class="form-control" placeholder="e.g. CS-201" required>
        </div>
        <div class="form-group">
          <label class="form-label">Course Title</label>
          <input type="text" name="title" class="form-control" placeholder="e.g. Advanced Python Software Engineering" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Short Summary (Catalog pitch)</label>
        <input type="text" name="short_description" class="form-control" placeholder="One-line summary for prospective students" required>
      </div>

      <div class="form-group">
        <label class="form-label">Full Course Overview</label>
        <textarea name="full_description" class="form-control" rows="4" placeholder="Detailed description of topics, projects, and learning journey..." required></textarea>
      </div>

      <div class="grid-3">
        <div class="form-group">
          <label class="form-label">Category</label>
          <select name="category" class="form-control">
            <option value="Computer Science">Computer Science</option>
            <option value="Data Science">Data Science & AI</option>
            <option value="Web Engineering">Web Engineering</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Software Architecture">Software Architecture</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Difficulty</label>
          <select name="difficulty" class="form-control">
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Estimated Hours</label>
          <input type="number" name="duration_hours" class="form-control" value="20" required>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Max Student Capacity</label>
          <input type="number" name="capacity" class="form-control" value="100" required>
        </div>
        <div class="form-group">
          <label class="form-label">Passing Grade (%)</label>
          <input type="number" step="0.5" name="passing_grade" class="form-control" value="60.0" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Prerequisites</label>
        <input type="text" name="prerequisites" class="form-control" placeholder="e.g. Basic Python or CS-101">
      </div>

      <div class="form-group">
        <label class="form-label">Key Learning Objectives (one per line)</label>
        <textarea name="learning_objectives" class="form-control" rows="3" placeholder="- Master Object-Oriented Design patterns&#10;- Implement database migrations and ORMs&#10;- Build and test enterprise services"></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
        Save Course Draft & Continue to Curriculum &rarr;
      </button>
    </form>
  </div>
</div>
{% endblock %}
