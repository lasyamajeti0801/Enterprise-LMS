{% extends "base.html" %}

{% block title %}403 - Access Denied{% endblock %}

  <h1 class="page-title" style="color: var(--danger); font-size: 2.5rem; margin-bottom: 0.5rem;">403 - Access Denied</h1>

{% endblock %}
