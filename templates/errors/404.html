{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
  <div style="font-size: 4rem; margin-bottom: 1rem;">🔍</div>
  <h1 class="page-title" style="font-size: 2.5rem; margin-bottom: 0.5rem;">404 - Page Not Found</h1>
  <p style="color: var(--text-secondary); max-width: 500px; margin: 0 auto 2rem;">
    The requested resource or page does not exist or has been relocated.
  </p>
  <a href="{{ url_for('auth.landing') }}" class="btn btn-primary">Return to Safety</a>
</div>
{% endblock %}
