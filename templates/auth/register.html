{% extends "base.html" %}

{% block title %}Student Registration - Enterprise LMS{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h1 class="card-title" style="font-size: 1.5rem;">Create Student Account</h1>
      <p style="font-size: 0.85rem; color: var(--text-secondary);">Join the enterprise learning community</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text" name="first_name" class="form-control" placeholder="Jane" required>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" name="last_name" class="form-control" placeholder="Doe" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="janedoe" required>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="jane.doe@university.edu" required>
      </div>

      <div class="form-group">
        <label class="form-label">Major / Field of Study</label>
        <input type="text" name="major" class="form-control" placeholder="Computer Science & AI" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
        Complete Registration
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color);">
      <a href="{{ url_for('auth.student_login') }}" style="font-size: 0.85rem; color: var(--text-secondary);">Already registered? Sign in to Student Portal &rarr;</a>
    </div>
  </div>
</div>
{% endblock %}
